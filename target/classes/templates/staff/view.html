<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Staff record')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('staff')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${member.staffNumber}"></p>
    <h1 th:text="${member.fullName}">Name</h1>
    <p class="standfirst">
        <span class="tag neutral" th:text="${member.staffType}"></span>
        <span th:text="${member.jobTitle} ?: ''"></span> ·
        <span th:text="${weeklyLoad}">0</span> lessons a week
    </p>

    <p class="no-print">
        <a class="btn quiet" th:href="@{/staff/{id}/edit(id=${member.id})}">Edit</a>
        <a class="btn quiet" th:href="@{/timetable/teacher/{id}(id=${member.id})}">Timetable</a>
    </p>

    <div class="grid two">
        <div class="panel">
            <h3>Contact</h3>
            <p><strong>Mobile</strong> <span class="code" th:text="${member.mobilePhone}"></span></p>
            <p><strong>Email</strong> <span th:text="${member.email} ?: '—'"></span></p>
            <p><strong>Joined</strong> <span th:text="${member.dateJoined}"></span></p>
            <p><strong>Registration</strong> <span th:text="${member.teacherRegistrationNo} ?: '—'"></span></p>
        </div>
        <div class="panel">
            <h3>Qualifications</h3>
            <p th:text="${member.qualifications} ?: 'Nothing recorded'"></p>
        </div>
    </div>

    <h2>Teaching allocation</h2>
    <table class="register" th:if="${!#lists.isEmpty(allocations)}">
        <thead><tr><th>Class</th><th>Subject</th><th class="num">Periods/week</th></tr></thead>
        <tbody>
        <tr th:each="a : ${allocations}">
            <td><a th:href="@{/academics/classes/{id}(id=${a.schoolClass.id})}"
                   th:text="${a.schoolClass.name}"></a></td>
            <td th:text="${a.subject.name}"></td>
            <td class="num" th:text="${a.periodsPerWeek}"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(allocations)}">Nothing allocated.</div>

    <h2>Attendance, last 30 days</h2>
    <table class="register" th:if="${!#lists.isEmpty(recentAttendance)}">
        <thead><tr><th>Date</th><th>Status</th><th>Arrived</th><th>Departed</th>
            <th class="num">Min. late</th><th class="num">Min. on duty</th></tr></thead>
        <tbody>
        <tr th:each="a : ${recentAttendance}">
            <td class="code" th:text="${a.attendanceDate}"></td>
            <td><span class="tag" th:classappend="${a.status.name()=='PRESENT'} ? 'ok' :
                      (${a.status.name()=='LATE'} ? 'warn' : 'bad')" th:text="${a.status}"></span></td>
            <td class="code" th:text="${a.arrivalTime} ?: '—'"></td>
            <td class="code" th:text="${a.departureTime} ?: '—'"></td>
            <td class="num" th:text="${a.minutesLate}"></td>
            <td class="num" th:text="${a.minutesOnDuty} ?: '—'"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(recentAttendance)}">No sign-in records.</div>
</main>
</body>
</html>
