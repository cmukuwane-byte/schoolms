<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Subjects')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('academics')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Curriculum</p>
    <h1>Subjects</h1>
    <p class="standfirst">Display order controls the sequence of rows on the report card.</p>

    <div class="panel" style="margin-bottom:1rem">
        <h3>Add or amend a subject</h3>
        <form class="inline" th:action="@{/academics/subjects}" th:object="${subject}" method="post">
            <div class="field"><label>Code</label><input type="text" th:field="*{code}" required
                style="width:7rem"></div>
            <div class="field"><label>Name</label><input type="text" th:field="*{name}" required></div>
            <div class="field"><label>Phase</label>
                <select th:field="*{phase}" required>
                    <option th:each="p : ${phases}" th:value="${p}" th:text="${p}"></option>
                </select></div>
            <div class="field"><label>Order</label>
                <input type="number" th:field="*{displayOrder}" style="width:5rem"></div>
            <button class="btn" type="submit">Save</button>
        </form>
    </div>

    <table class="register" th:if="${!#lists.isEmpty(subjects)}">
        <thead><tr><th>Code</th><th>Subject</th><th>Phase</th><th>Core</th><th class="num">Order</th></tr></thead>
        <tbody>
        <tr th:each="s : ${subjects}">
            <td class="code" th:text="${s.code}"></td>
            <td th:text="${s.name}"></td>
            <td><span class="tag neutral" th:text="${s.phase}"></span></td>
            <td th:text="${s.core} ? 'Yes' : 'No'"></td>
            <td class="num" th:text="${s.displayOrder}"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(subjects)}">No subjects yet.</div>
</main>
</body>
</html>
