<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Dormitory')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('boarding')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${dormitory.hostel.name} + ' · ' + ${dormitory.hostel.gender}"></p>
    <h1 th:text="${dormitory.name}">Dormitory</h1>
    <p class="standfirst">
        <span th:text="${#lists.size(residents)}">0</span> of
        <span th:text="${dormitory.bedCapacity}">0</span> beds taken.</p>

    <table class="register" th:if="${!#lists.isEmpty(residents)}">
        <thead><tr><th>Bed</th><th>Adm. no.</th><th>Learner</th><th>Class</th>
            <th>Since</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${residents}">
            <td class="code" th:text="${a.bedNumber} ?: '—'"></td>
            <td class="code" th:text="${a.student.studentNumber}"></td>
            <td><a th:href="@{/students/{id}(id=${a.student.id})}"
                   th:text="${a.student.fullNameFormal}"></a></td>
            <td th:text="${a.student.currentClass != null} ? ${a.student.currentClass.name} : '—'"></td>
            <td class="code" th:text="${a.allocatedOn}"></td>
            <td><form method="post" th:action="@{/boarding/vacate}">
                <input type="hidden" name="studentId" th:value="${a.student.id}">
                <input type="hidden" name="dormitoryId" th:value="${dormitory.id}">
                <button class="btn small quiet" type="submit">Vacate</button></form></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(residents)}">No one allocated here yet.</div>

    <div class="panel" style="margin-top:1rem">
        <h3>Allocate a bed</h3>
        <form class="inline" method="post" th:action="@{/boarding/allocate}">
            <input type="hidden" name="dormitoryId" th:value="${dormitory.id}">
            <div class="field"><label>Learner ID</label>
                <input type="number" name="studentId" required style="width:8rem"></div>
            <div class="field"><label>Bed number</label>
                <input type="text" name="bedNumber" style="width:6rem"></div>
            <button class="btn" type="submit">Allocate</button>
        </form>
    </div>
</main>
</body>
</html>
