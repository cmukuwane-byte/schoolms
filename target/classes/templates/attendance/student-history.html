<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Attendance history')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('attendance')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Attendance</p>
    <h1>Attendance history</h1>
    <p class="standfirst">From <span th:text="${from}"></span> to today.</p>

    <table class="register" th:if="${!#lists.isEmpty(records)}">
        <thead><tr><th>Date</th><th>Session</th><th>Class</th><th>Status</th>
            <th>Arrived</th><th>Remarks</th></tr></thead>
        <tbody>
        <tr th:each="a : ${records}">
            <td class="code" th:text="${a.attendanceDate}"></td>
            <td th:text="${a.sessionName}"></td>
            <td th:text="${a.schoolClass.name}"></td>
            <td><span class="tag" th:classappend="${a.status.name()=='PRESENT'} ? 'ok' :
                      (${a.status.name()=='LATE'} ? 'warn' : 'bad')" th:text="${a.status}"></span></td>
            <td class="code" th:text="${a.arrivalTime} ?: '—'"></td>
            <td th:text="${a.remarks} ?: ''"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(records)}">No records in that window.</div>
</main>
</body>
</html>
