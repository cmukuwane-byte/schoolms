<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Tests and exams')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('assessment')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${term != null} ? ${term.name} + ' ' + ${term.academicYear.year} : 'No term set'"></p>
    <h1>Tests and exams</h1>
    <p class="standfirst">Each sitting belongs to one class and one subject.</p>

    <form class="inline" method="get" th:action="@{/assessments}" style="margin-bottom:1rem">
        <div class="field"><label>Class</label>
            <select name="classId" required>
                <option value="">Choose a class</option>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == classId}"></option>
            </select></div>
        <button class="btn" type="submit">Show</button>
        <a class="btn quiet" th:if="${classId != null}"
           th:href="@{/assessments/new(classId=${classId})}">New sitting</a>
    </form>

    <table class="register" th:if="${!#lists.isEmpty(assessments)}">
        <thead><tr><th>Title</th><th>Type</th><th>Subject</th><th>Date</th>
            <th class="num">Out of</th><th class="num">Weight %</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${assessments}">
            <td th:text="${a.title}"></td>
            <td><span class="tag neutral" th:text="${a.type}"></span></td>
            <td th:text="${a.subject.name}"></td>
            <td class="code" th:text="${a.assessmentDate}"></td>
            <td class="num" th:text="${a.maxMark}"></td>
            <td class="num" th:text="${a.weightPercent}"></td>
            <td><span class="tag" th:classappend="${a.published} ? 'ok' : 'warn'"
                      th:text="${a.published} ? 'Published' : 'Draft'"></span></td>
            <td><a class="btn small" th:href="@{/assessments/{id}/marks(id=${a.id})}">Marks</a></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(assessments)}">
        Choose a class to see its sittings, or create one.</div>
</main>
</body>
</html>
