<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My children')}"></head>
<body>
<header class="masthead">
    <span class="crest">School Management System</span>
    <span class="spacer"></span>
    <form th:action="@{/logout}" method="post"><button class="btn small quiet" type="submit">Sign out</button></form>
</header>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Guardian portal</p>
    <h1>My children</h1>
    <p class="standfirst">Reports appear here once the school releases them.</p>

    <table class="register" th:if="${!#lists.isEmpty(wards)}">
        <thead><tr><th>Adm. no.</th><th>Name</th><th>Class</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="w : ${wards}">
            <td class="code" th:text="${w.studentNumber}"></td>
            <td th:text="${w.fullName}"></td>
            <td th:text="${w.currentClass != null} ? ${w.currentClass.name} : '—'"></td>
            <td><span class="tag ok" th:text="${w.status}"></span></td>
            <td><a class="btn small" th:href="@{/portal/child/{id}(id=${w.id})}">Open</a></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(wards)}">
        No learners are linked to your account. Please contact the school office.</div>
</main>
</body>
</html>
