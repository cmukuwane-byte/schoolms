<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Disciplinary case')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('students')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>

    <p class="eyebrow" th:text="${student.studentNumber}"></p>
    <h1>Record a disciplinary outcome</h1>
    <p class="standfirst">
        A suspension needs start and end dates. An expulsion needs a hearing date and
        closes the learner's record.</p>

    <form th:action="@{/students/{id}/discipline(id=${student.id})}" th:object="${case}"
          method="post" style="max-width:34rem">
        <div class="field"><label>Incident date</label>
            <input type="date" th:field="*{incidentDate}" required></div>
        <div class="field"><label>Reported by</label>
            <input type="text" th:field="*{reportedBy}"></div>
        <div class="field"><label>What happened</label>
            <textarea th:field="*{description}" required></textarea></div>
        <div class="field"><label>Outcome</label>
            <select th:field="*{outcome}" required>
                <option th:each="o : ${outcomes}" th:value="${o}" th:text="${o}"></option>
            </select></div>
        <div class="grid two">
            <div class="field"><label>Suspension from</label>
                <input type="date" th:field="*{suspensionStart}"></div>
            <div class="field"><label>Suspension to</label>
                <input type="date" th:field="*{suspensionEnd}"></div>
        </div>
        <div class="field"><label>Hearing date (required for expulsion)</label>
            <input type="date" th:field="*{hearingDate}"></div>
        <div class="field">
            <label><input type="checkbox" th:field="*{guardianNotified}" style="width:auto">
                Guardian has been notified</label></div>
        <button class="btn danger" type="submit">Record outcome</button>
        <a class="btn quiet" th:href="@{/students/{id}(id=${student.id})}">Cancel</a>
    </form>
</main>
</body>
</html>
