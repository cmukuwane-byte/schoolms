<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Transfer out')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('students')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>

    <p class="eyebrow" th:text="${student.studentNumber}"></p>
    <h1>Transfer out</h1>
    <p class="standfirst">
        Recording a transfer closes <span th:text="${student.fullName}"></span>'s place.
        Outstanding library books must be returned first.</p>

    <form th:action="@{/students/{id}/transfer(id=${student.id})}" th:object="${transfer}"
          method="post" style="max-width:34rem">
        <div class="field"><label>Receiving school</label>
            <input type="text" th:field="*{otherSchool}" required></div>
        <div class="field"><label>Its address</label>
            <textarea th:field="*{otherSchoolAddress}"></textarea></div>
        <div class="field"><label>Effective date</label>
            <input type="date" th:field="*{effectiveDate}" required></div>
        <div class="field"><label>Transfer letter reference</label>
            <input type="text" th:field="*{letterReference}"></div>
        <div class="field"><label>Reason</label>
            <textarea th:field="*{reason}"></textarea></div>
        <div class="field">
            <label><input type="checkbox" th:field="*{feesCleared}" style="width:auto"> Fees cleared</label>
            <label><input type="checkbox" th:field="*{clearanceGiven}" style="width:auto"> Clearance signed</label>
        </div>
        <button class="btn danger" type="submit">Record transfer</button>
        <a class="btn quiet" th:href="@{/students/{id}(id=${student.id})}">Cancel</a>
    </form>
</main>
</body>
</html>
