<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Staff sign-in book')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('attendance')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${#temporals.format(date, 'EEEE d MMMM yyyy')}"></p>
    <h1>Staff sign-in book</h1>
    <p class="standfirst">Arrivals, departures and lateness. Lateness is worked out against the
       expected reporting time.</p>

    <form class="inline" method="get" th:action="@{/attendance/staff}" style="margin-bottom:1rem">
        <div class="field"><label>Date</label><input type="date" name="date" th:value="${date}"></div>
        <button class="btn quiet" type="submit">Show</button>
    </form>

    <div class="grid two">
        <div class="panel">
            <h3>Sign in</h3>
            <form class="inline" method="post" th:action="@{/attendance/staff/sign-in}">
                <input type="hidden" name="date" th:value="${date}">
                <div class="field"><label>Member of staff</label>
                    <select name="staffId" required>
                        <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.fullName}"></option>
                    </select></div>
                <div class="field"><label>Time</label><input type="time" name="arrival" style="width:7rem"></div>
                <button class="btn" type="submit">Sign in</button>
            </form>
        </div>
        <div class="panel">
            <h3>Sign out</h3>
            <form class="inline" method="post" th:action="@{/attendance/staff/sign-out}">
                <input type="hidden" name="date" th:value="${date}">
                <div class="field"><label>Member of staff</label>
                    <select name="staffId" required>
                        <option th:each="a : ${stillOn}" th:value="${a.staff.id}"
                                th:text="${a.staff.fullName}"></option>
                    </select></div>
                <div class="field"><label>Time</label><input type="time" name="departure" style="width:7rem"></div>
                <button class="btn" type="submit">Sign out</button>
            </form>
        </div>
    </div>

    <div class="panel" style="margin-top:1rem">
        <h3>Record an absence</h3>
        <form class="inline" method="post" th:action="@{/attendance/staff/absent}">
            <input type="hidden" name="date" th:value="${date}">
            <div class="field"><label>Member of staff</label>
                <select name="staffId" required>
                    <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.fullName}"></option>
                </select></div>
            <div class="field"><label>Status</label>
                <select name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select></div>
            <div class="field"><label>Remarks</label><input type="text" name="remarks"></div>
            <button class="btn quiet" type="submit">Record</button>
        </form>
    </div>

    <h2>Today's book</h2>
    <table class="register" th:if="${!#lists.isEmpty(records)}">
        <thead><tr><th>Staff no.</th><th>Name</th><th>Status</th><th>Arrived</th><th>Departed</th>
            <th class="num">Late (min)</th><th class="num">On duty (min)</th><th>Remarks</th></tr></thead>
        <tbody>
        <tr th:each="a : ${records}">
            <td class="code" th:text="${a.staff.staffNumber}"></td>
            <td><a th:href="@{/staff/{id}(id=${a.staff.id})}" th:text="${a.staff.fullName}"></a></td>
            <td><span class="tag" th:classappend="${a.status.name()=='PRESENT'} ? 'ok' :
                      (${a.status.name()=='LATE'} ? 'warn' : 'bad')" th:text="${a.status}"></span></td>
            <td class="code" th:text="${a.arrivalTime} ?: '—'"></td>
            <td class="code" th:text="${a.departureTime} ?: '—'"></td>
            <td class="num" th:text="${a.minutesLate}"></td>
            <td class="num" th:text="${a.minutesOnDuty} ?: '—'"></td>
            <td th:text="${a.remarks} ?: ''"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(records)}">Nobody has signed in yet.</div>
</main>
</body>
</html>
