<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Attendance')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('attendance')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${#temporals.format(today, 'EEEE d MMMM yyyy')}"></p>
    <h1>Attendance</h1>
    <p class="standfirst">Learner registers by class, and the staff sign-in book.</p>

    <div class="grid four">
        <div class="tally"><div class="figure" th:text="${summary['PRESENT'] ?: 0}">0</div>
            <div class="label">Present</div></div>
        <div class="tally flag"><div class="figure" th:text="${summary['ABSENT'] ?: 0}">0</div>
            <div class="label">Absent</div></div>
        <div class="tally"><div class="figure" th:text="${summary['LATE'] ?: 0}">0</div>
            <div class="label">Late</div></div>
        <div class="tally"><div class="figure" th:text="${summary['EXCUSED'] ?: 0}">0</div>
            <div class="label">Excused</div></div>
    </div>

    <h2>Open a class register</h2>
    <form class="inline" method="get" th:action="@{/attendance/register}">
        <div class="field"><label>Class</label>
            <select name="classId" required>
                <option th:each="c : ${classes}" th:value="${c.id}"
                        th:text="${c.phase} + ' — ' + ${c.name}"></option>
            </select></div>
        <div class="field"><label>Date</label>
            <input type="date" name="date" th:value="${today}"></div>
        <div class="field"><label>Session</label>
            <select name="session">
                <option>MORNING</option><option>AFTERNOON</option><option>EVENING</option>
            </select></div>
        <button class="btn" type="submit">Open register</button>
    </form>

    <h2>Elsewhere</h2>
    <p>
        <a class="btn quiet" th:href="@{/attendance/staff}"
           sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_HEAD')">Staff sign-in book</a>
        <a class="btn quiet" th:href="@{/attendance/follow-up}">Absence follow-up list</a>
    </p>
</main>
</body>
</html>
