<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Absence follow-up')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('attendance')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">This term</p>
    <h1>Learners to follow up</h1>
    <p class="standfirst">Anyone absent <span th:text="${threshold}"></span> or more times this term.</p>

    <form class="inline" method="get" th:action="@{/attendance/follow-up}" style="margin-bottom:1rem">
        <div class="field"><label>Threshold</label>
            <input type="number" name="threshold" th:value="${threshold}" min="1" style="width:6rem"></div>
        <button class="btn quiet" type="submit">Apply</button>
    </form>

    <table class="register" th:if="${!#lists.isEmpty(rows)}">
        <thead><tr><th>Adm. no.</th><th>Name</th><th>Class</th><th class="num">Absences</th><th></th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td class="code" th:text="${r[0].studentNumber}"></td>
            <td><a th:href="@{/students/{id}(id=${r[0].id})}" th:text="${r[0].fullNameFormal}"></a></td>
            <td th:text="${r[0].currentClass != null} ? ${r[0].currentClass.name} : '—'"></td>
            <td class="num" th:text="${r[1]}"></td>
            <td><a class="btn small quiet"
                   th:href="@{/attendance/student/{id}(id=${r[0].id})}">History</a></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(rows)}">Nobody is over the threshold.</div>
</main>
</body>
</html>
