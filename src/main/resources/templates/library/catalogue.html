<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Catalogue')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('library')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Library</p>
    <h1>Catalogue</h1>
    <p class="standfirst"><span th:text="${#lists.size(books)}">0</span> title(s).</p>

    <form class="inline" method="get" th:action="@{/library/catalogue}" style="margin-bottom:1rem">
        <div class="field" style="min-width:16rem"><label>Title, author, ISBN or shelf code</label>
            <input type="text" name="q" th:value="${q}"></div>
        <div class="field"><label>Category</label>
            <select name="category">
                <option value="">All</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                        th:selected="${c == category}"></option>
            </select></div>
        <button class="btn" type="submit">Search</button>
        <a class="btn quiet" th:href="@{/library/catalogue/new}">Add a title</a>
    </form>

    <table class="register" th:if="${!#lists.isEmpty(books)}">
        <thead><tr><th>Title</th><th>Author</th><th>Class no.</th><th>Category</th>
            <th class="num">Copies</th><th class="num">Available</th></tr></thead>
        <tbody>
        <tr th:each="b : ${books}">
            <td><a th:href="@{/library/catalogue/{id}(id=${b.id})}" th:text="${b.title}"></a></td>
            <td th:text="${b.author} ?: '—'"></td>
            <td class="code" th:text="${b.classification} ?: '—'"></td>
            <td th:text="${b.category} ?: '—'"></td>
            <td class="num" th:text="${#lists.size(b.copies)}"></td>
            <td class="num" th:text="${b.availableCount}"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(books)}">No titles match.</div>
</main>
</body>
</html>
