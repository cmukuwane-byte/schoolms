<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Add a title')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('library')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Library</p>
    <h1>Add a title</h1>
    <p class="standfirst">Add the title first, then accession physical copies against it.</p>

    <form th:action="@{/library/catalogue}" th:object="${book}" method="post" style="max-width:34rem">
        <div class="field"><label>Title</label><input type="text" th:field="*{title}" required></div>
        <div class="field"><label>Author</label><input type="text" th:field="*{author}"></div>
        <div class="grid two">
            <div class="field"><label>ISBN</label><input type="text" th:field="*{isbn}"></div>
            <div class="field"><label>Year</label><input type="number" th:field="*{publicationYear}"></div>
        </div>
        <div class="field"><label>Publisher</label><input type="text" th:field="*{publisher}"></div>
        <div class="field"><label>Edition</label><input type="text" th:field="*{edition}"></div>
        <div class="grid two">
            <div class="field"><label>Shelf classification</label>
                <input type="text" th:field="*{classification}" placeholder="510.2 or FIC-ACH"></div>
            <div class="field"><label>Category</label>
                <input type="text" th:field="*{category}" placeholder="Textbook, Fiction, Reference"></div>
        </div>
        <div class="field"><label>Set book for</label>
            <select th:field="*{subject}">
                <option value="">Not a set book</option>
                <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"></option>
            </select></div>
        <div class="field"><label>Synopsis</label><textarea th:field="*{synopsis}"></textarea></div>
        <button class="btn" type="submit">Save title</button>
        <a class="btn quiet" th:href="@{/library/catalogue}">Cancel</a>
    </form>
</main>
</body>
</html>
