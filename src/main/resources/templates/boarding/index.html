<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Boarding')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('boarding')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Hostels</p>
    <h1>Boarding</h1>
    <p class="standfirst"><span th:text="${boarderCount}">0</span> boarders on the register.</p>

    <p style="margin:.5rem 0 1rem">
        <a class="btn quiet" th:href="@{/boarding/setup}">Set up hostels and dormitories</a>
    </p>

    <h2>Dormitory occupancy</h2>
    <table class="register" th:if="${!#lists.isEmpty(occupancy)}">
        <thead><tr><th>Hostel</th><th>Dormitory</th><th class="num">Occupied</th>
            <th class="num">Beds</th><th></th></tr></thead>
        <tbody>
        <tr th:each="row : ${occupancy}">
            <td th:text="${row[1].name}"></td>
            <td th:text="${row[0].name}"></td>
            <td class="num" th:text="${row[2]}"></td>
            <td class="num" th:text="${row[0].bedCapacity}"></td>
            <td><a class="btn small quiet"
                   th:href="@{/boarding/dormitory/{id}(id=${row[0].id})}">Open</a></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(occupancy)}">
        No dormitories set up yet.
        <a th:href="@{/boarding/setup}">Create a hostel and its dormitories</a> first.</div>

    <h2>Signed out and not back</h2>
    <table class="register" th:if="${!#lists.isEmpty(outstandingExeats)}">
        <thead><tr><th>Learner</th><th>Left</th><th>Expected back</th><th>Reason</th>
            <th>Collected by</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${outstandingExeats}">
            <td th:text="${e.student.fullName}"></td>
            <td class="code" th:text="${#temporals.format(e.departureTime, 'dd MMM HH:mm')}"></td>
            <td class="code" th:text="${#temporals.format(e.expectedReturn, 'dd MMM HH:mm')}"></td>
            <td th:text="${e.reason}"></td>
            <td th:text="${e.collectedBy} ?: '—'"></td>
            <td><form method="post" th:action="@{/boarding/exeat/{id}/return(id=${e.id})}">
                <button class="btn small quiet" type="submit">Log return</button></form></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(outstandingExeats)}">Everyone is in.</div>
</main>
</body>
</html>
