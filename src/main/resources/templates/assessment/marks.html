<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Mark sheet')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('assessment')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${assessment.schoolClass.name} + ' · ' + ${assessment.subject.name}"></p>
    <h1 th:text="${assessment.title}">Mark sheet</h1>
    <p class="standfirst">
        Out of <span th:text="${assessment.maxMark}"></span>,
        worth <span th:text="${assessment.weightPercent}"></span>% of the term mark.
        <span class="tag" th:classappend="${assessment.published} ? 'ok' : 'warn'"
              th:text="${assessment.published} ? 'Published' : 'Draft'"></span>
    </p>

    <div class="grid four" th:if="${stats.entered != null and stats.entered > 0}">
        <div class="tally"><div class="figure" th:text="${stats.average}">0</div>
            <div class="label">Class average %</div></div>
        <div class="tally"><div class="figure" th:text="${stats.highest}">0</div>
            <div class="label">Highest %</div></div>
        <div class="tally"><div class="figure" th:text="${stats.lowest}">0</div>
            <div class="label">Lowest %</div></div>
        <div class="tally"><div class="figure" th:text="${stats.passRate}">0</div>
            <div class="label">Pass rate %</div></div>
    </div>

    <form th:action="@{/assessments/{id}/marks(id=${assessment.id})}" method="post">
        <table class="register" style="margin-top:1rem">
            <thead><tr><th class="num">#</th><th>Adm. no.</th><th>Name</th>
                <th class="num">Mark</th><th>Present</th><th>Comment</th></tr></thead>
            <tbody>
            <tr th:each="row, i : ${rows}">
                <td class="num" th:text="${i.count}"></td>
                <td class="code" th:text="${row.student.studentNumber}"></td>
                <td th:text="${row.student.fullNameFormal}"></td>
                <td class="num">
                    <input type="hidden" name="studentId" th:value="${row.student.id}">
                    <input type="number" step="0.5" class="mark" name="rawMark"
                           th:value="${row.rawMark}" th:max="${assessment.maxMark}" min="0"
                           th:disabled="${assessment.published}">
                </td>
                <td>
                    <select name="presence" th:disabled="${assessment.published}" style="width:6.5rem">
                        <option value="PRESENT" th:selected="${!row.absent}">Sat</option>
                        <option value="ABSENT"  th:selected="${row.absent}">Absent</option>
                    </select>
                </td>
                <td><input type="text" name="comment" th:value="${row.comment}"
                           th:disabled="${assessment.published}"></td>
            </tr>
            </tbody>
        </table>

        <p style="margin-top:1rem" class="no-print">
            <button class="btn" type="submit" th:unless="${assessment.published}">Save marks</button>
        </p>
    </form>

    <form th:action="@{/assessments/{id}/publish(id=${assessment.id})}" method="post"
          style="display:inline" th:unless="${assessment.published}">
        <button class="btn quiet" type="submit">Publish</button>
    </form>
    <form th:action="@{/assessments/{id}/unpublish(id=${assessment.id})}" method="post"
          style="display:inline" th:if="${assessment.published}"
          sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_HEAD')">
        <button class="btn quiet" type="submit">Reopen for editing</button>
    </form>
</main>
</body>
</html>
