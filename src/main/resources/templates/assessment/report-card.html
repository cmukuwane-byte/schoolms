<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Report card')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('reports')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>

    <div class="report-sheet">
        <div class="crest-line">TERMINAL REPORT</div>
        <div class="sub" th:text="${card.term.name} + ', ' + ${card.term.academicYear.year}"></div>

        <table class="register" style="border:none;margin-bottom:1.25rem">
            <tbody>
            <tr><th style="width:9rem">Learner</th><td th:text="${card.student.fullNameFormal}"></td>
                <th style="width:8rem">Admission no.</th><td class="code"
                    th:text="${card.student.studentNumber}"></td></tr>
            <tr><th>Class</th><td th:text="${card.schoolClass.name}"></td>
                <th>Position</th><td class="code"
                    th:text="${card.positionInClass} != null ?
                             ${card.positionInClass} + ' of ' + ${card.classSize} : '—'"></td></tr>
            <tr><th>Average</th><td class="code" th:text="${card.averagePercent} ?: '—'"></td>
                <th>Attendance</th><td class="code"
                    th:text="${card.daysPresent} + ' present, ' + ${card.daysAbsent} + ' absent'"></td></tr>
            </tbody>
        </table>

        <table class="register">
            <thead><tr><th>Subject</th><th class="num">Mark %</th><th>Grade</th>
                <th class="num">Class avg.</th><th>Teacher's remark</th></tr></thead>
            <tbody>
            <tr th:each="l : ${card.lines}">
                <td th:text="${l.subject.name}"></td>
                <td class="num" th:text="${l.finalPercent} ?: '—'"></td>
                <td class="code" th:text="${l.grade}"></td>
                <td class="num" th:text="${l.classAverage} ?: '—'"></td>
                <td th:text="${l.teacherComment} ?: ''"></td>
            </tr>
            </tbody>
        </table>

        <div style="margin-top:1.5rem">
            <p><strong>Class teacher</strong><br>
               <span th:text="${card.classTeacherComment} ?: '—'"></span></p>
            <p><strong>Head</strong><br>
               <span th:text="${card.headComment} ?: '—'"></span></p>
            <p th:if="${card.nextTermBegins}"><strong>Next term begins</strong>
               <span class="code" th:text="${card.nextTermBegins}"></span></p>
        </div>
    </div>

    <div class="panel no-print" style="margin-top:1.5rem" th:unless="${readOnly}">
        <h3>Comments and release</h3>
        <form th:action="@{/reports/{id}/comments(id=${card.id})}" method="post">
            <div class="field"><label>Class teacher's comment</label>
                <textarea name="classTeacherComment" th:text="${card.classTeacherComment}"></textarea></div>
            <div class="field"><label>Head's comment</label>
                <textarea name="headComment" th:text="${card.headComment}"></textarea></div>
            <div class="field"><label>Conduct</label>
                <input type="text" name="conduct" th:value="${card.conduct}"></div>
            <button class="btn" type="submit">Save comments</button>
        </form>
        <form th:action="@{/reports/{id}/release(id=${card.id})}" method="post" style="margin-top:.75rem"
              th:unless="${card.released}">
            <button class="btn quiet" type="submit">Release to guardians</button>
        </form>
    </div>

    <p class="no-print" style="margin-top:1rem">
        <button class="btn quiet" onclick="window.print()">Print</button>
    </p>
</main>
</body>
</html>
