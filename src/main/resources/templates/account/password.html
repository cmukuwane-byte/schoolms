<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Change password')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('home')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Account</p>
    <h1>Change your password</h1>
    <p class="standfirst" th:if="${first}">
        This is a first sign-in. Set your own password before going any further.</p>

    <form th:action="@{/account/password}" method="post" style="max-width:26rem">
        <div class="field">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" name="currentPassword" required>
        </div>
        <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="8">
        </div>
        <div class="field">
            <label for="confirmPassword">New password again</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <button class="btn" type="submit">Change password</button>
    </form>
</main>
</body>
</html>
