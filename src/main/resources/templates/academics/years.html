<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Setup')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('setup')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Setup</p>
    <h1>Years, terms and the bell schedule</h1>
    <p class="standfirst">Most screens read the current term. Set it here before term starts.</p>

    <h2>Academic years</h2>
    <table class="register">
        <thead><tr><th class="num">Year</th><th>From</th><th>To</th><th>Current</th><th></th></tr></thead>
        <tbody>
        <tr th:each="y : ${years}">
            <td class="num" th:text="${y.year}"></td>
            <td class="code" th:text="${y.startDate}"></td>
            <td class="code" th:text="${y.endDate}"></td>
            <td><span th:if="${y.current}" class="tag ok">Current</span></td>
            <td><form th:action="@{/academics/years/{id}/current(id=${y.id})}" method="post">
                <button class="btn small quiet" type="submit" th:unless="${y.current}">Make current</button>
            </form></td>
        </tr>
        </tbody>
    </table>

    <h2>Terms</h2>
    <table class="register">
        <thead><tr><th>Term</th><th>Year</th><th>From</th><th>To</th><th>Current</th>
            <th>Marks</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${terms}">
            <td th:text="${t.name}"></td>
            <td class="num" th:text="${t.academicYear.year}"></td>
            <td class="code" th:text="${t.startDate}"></td>
            <td class="code" th:text="${t.endDate}"></td>
            <td><span th:if="${t.current}" class="tag ok">Current</span></td>
            <td><span class="tag" th:classappend="${t.marksLocked} ? 'bad' : 'ok'"
                      th:text="${t.marksLocked} ? 'Closed' : 'Open'"></span></td>
            <td>
                <form th:action="@{/academics/terms/{id}/current(id=${t.id})}" method="post"
                      style="display:inline">
                    <button class="btn small quiet" type="submit" th:unless="${t.current}">Make current</button>
                </form>
                <form th:action="@{/academics/terms/{id}/lock(id=${t.id})}" method="post"
                      style="display:inline">
                    <input type="hidden" name="locked" th:value="${!t.marksLocked}">
                    <button class="btn small quiet" type="submit"
                            th:text="${t.marksLocked} ? 'Reopen marks' : 'Close marks'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Bell schedule</h2>
    <table class="register">
        <thead><tr><th>Phase</th><th class="num">Period</th><th>Label</th><th>From</th>
            <th>To</th><th>Teaching</th></tr></thead>
        <tbody>
        <tr th:each="p : ${periods}">
            <td><span class="tag neutral" th:text="${p.phase}"></span></td>
            <td class="num" th:text="${p.periodNumber}"></td>
            <td th:text="${p.label}"></td>
            <td class="code" th:text="${p.startTime}"></td>
            <td class="code" th:text="${p.endTime}"></td>
            <td th:text="${p.teachingPeriod} ? 'Yes' : 'No'"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
