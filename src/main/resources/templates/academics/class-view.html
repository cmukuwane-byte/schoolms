<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Class')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('academics')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${schoolClass.phase} + ' · Grade level ' + ${schoolClass.gradeLevel}"></p>
    <h1 th:text="${schoolClass.name}">Class</h1>
    <p class="standfirst">
        <span th:text="${#lists.size(roll)}">0</span> of <span th:text="${schoolClass.maxCapacity}">0</span>
        places filled ·
        Class teacher: <span th:text="${schoolClass.classTeacher != null} ?
            ${schoolClass.classTeacher.fullName} : 'not assigned'"></span>
    </p>

    <p class="no-print">
        <a class="btn quiet" th:href="@{/academics/classes/{id}/edit(id=${schoolClass.id})}">Edit class</a>
        <a class="btn quiet" th:href="@{/timetable/class/{id}(id=${schoolClass.id})}">Timetable</a>
        <a class="btn quiet" th:href="@{/attendance/register(classId=${schoolClass.id})}">Register</a>
        <a class="btn quiet" th:href="@{/reports(classId=${schoolClass.id})}">Report cards</a>
    </p>

    <h2>Subject allocation</h2>
    <table class="register" th:if="${!#lists.isEmpty(allocations)}">
        <thead><tr><th>Subject</th><th>Teacher</th><th class="num">Periods/week</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${allocations}">
            <td th:text="${a.subject.name}"></td>
            <td th:text="${a.teacher.fullName}"></td>
            <td class="num" th:text="${a.periodsPerWeek}"></td>
            <td sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_HEAD')">
                <form method="post" th:action="@{/staff/allocations/{id}/remove(id=${a.id})}"
                      style="display:inline">
                    <input type="hidden" name="classId" th:value="${schoolClass.id}">
                    <button class="btn small quiet" type="submit">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(allocations)}">No subjects allocated yet.</div>

    <div class="panel no-print" style="margin-top:1rem"
         sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_HEAD')">
        <h3>Allocate a subject</h3>
        <form class="inline" method="post" th:action="@{/staff/allocations}">
            <input type="hidden" name="classId" th:value="${schoolClass.id}">
            <div class="field"><label>Subject</label>
                <select name="subjectId" required>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"></option>
                </select></div>
            <div class="field"><label>Teacher</label>
                <select name="teacherId" required>
                    <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
                </select></div>
            <div class="field"><label>Periods/week</label>
                <input type="number" name="periodsPerWeek" value="4" min="1" max="20" style="width:6rem"></div>
            <button class="btn" type="submit">Allocate</button>
        </form>
    </div>

    <h2>Class roll</h2>
    <table class="register" th:if="${!#lists.isEmpty(roll)}">
        <thead><tr><th class="num">#</th><th>Adm. no.</th><th>Name</th><th>Sex</th>
            <th class="num">Age</th><th>Residency</th></tr></thead>
        <tbody>
        <tr th:each="s, i : ${roll}">
            <td class="num" th:text="${i.count}"></td>
            <td class="code" th:text="${s.studentNumber}"></td>
            <td><a th:href="@{/students/{id}(id=${s.id})}" th:text="${s.fullNameFormal}"></a></td>
            <td th:text="${s.gender}"></td>
            <td class="num" th:text="${s.age}"></td>
            <td th:text="${s.residency}"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(roll)}">No learners in this class.</div>
</main>
</body>
</html>
