<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Lesson plan')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('lessons')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow" th:text="${term != null} ? ${term.name} + ' ' + ${term.academicYear.year} : ''"></p>
    <h1 th:text="${plan.id} == null ? 'New lesson plan' : 'Edit lesson plan'">Lesson plan</h1>
    <p class="standfirst">Save as a draft as often as you like. Submitting sends it to the head and
       locks it until they approve it or send it back.</p>

    <form th:action="@{/lessons}" th:object="${plan}" method="post" style="max-width:46rem">
        <input type="hidden" th:field="*{id}">

        <div class="field"><label>Class and subject</label>
            <select id="allocation" required>
                <option value="">Choose…</option>
                <option th:each="a : ${allocations}"
                        th:value="${a.schoolClass.id} + ':' + ${a.subject.id} + ':' + ${a.schoolClass.gradeLevel}"
                        th:text="${a.schoolClass.name} + ' — ' + ${a.subject.name}"
                        th:selected="${plan.schoolClass != null and plan.subject != null
                                       and a.schoolClass.id == plan.schoolClass.id
                                       and a.subject.id == plan.subject.id}"></option>
            </select></div>
        <input type="hidden" name="schoolClass" id="schoolClassId"
               th:value="${plan.schoolClass != null} ? ${plan.schoolClass.id} : ''">
        <input type="hidden" name="subject" id="subjectId"
               th:value="${plan.subject != null} ? ${plan.subject.id} : ''">

        <div class="grid two">
            <div class="field"><label>Week of term</label>
                <input type="number" id="weekNumber" th:field="*{weekNumber}"
                       min="1" max="15" required></div>
            <div class="field"><label>Week starting (Monday)</label>
                <input type="date" th:field="*{weekStarting}"></div>
        </div>

        <p style="margin:.25rem 0 1rem">
            <button class="btn small quiet" type="button" onclick="pullScheme()">
                Fill from the scheme of work</button>
            <span id="schemeNote" style="font-size:.82rem;margin-left:.5rem"></span>
        </p>

        <div class="field"><label>Topic</label>
            <input type="text" th:field="*{topic}" required></div>
        <div class="field"><label>Periods this week</label>
            <input type="number" th:field="*{periodsPlanned}" min="1" max="20" style="width:6rem"></div>

        <div class="field"><label>Objectives</label>
            <textarea th:field="*{objectives}" rows="4"></textarea></div>
        <div class="field"><label>What I will do</label>
            <textarea th:field="*{teacherActivities}" rows="4"></textarea></div>
        <div class="field"><label>What the learners will do</label>
            <textarea th:field="*{learnerActivities}" rows="4"></textarea></div>
        <div class="field"><label>Media and resources</label>
            <textarea th:field="*{mediaAndResources}" rows="2"></textarea></div>
        <div class="field"><label>How I will check understanding</label>
            <textarea th:field="*{assessmentMethod}" rows="2"></textarea></div>
        <div class="field"><label>Homework</label>
            <textarea th:field="*{homework}" rows="2"></textarea></div>
        <div class="field"><label>Reflection — fill this in after the week</label>
            <textarea th:field="*{reflection}" rows="3"></textarea></div>

        <button class="btn quiet" type="submit" name="submit" value="false">Save draft</button>
        <button class="btn" type="submit" name="submit" value="true">Save and submit</button>
        <a class="btn quiet" th:href="@{/lessons}">Cancel</a>
    </form>

    <script th:inline="javascript">
        var termNumber = /*[[${term != null} ? ${term.termNumber} : 1]]*/ 1;

        function splitAllocation() {
            var v = document.getElementById('allocation').value;
            return v ? v.split(':') : null;
        }

        document.getElementById('allocation').addEventListener('change', function () {
            var parts = splitAllocation();
            document.getElementById('schoolClassId').value = parts ? parts[0] : '';
            document.getElementById('subjectId').value     = parts ? parts[1] : '';
        });

        function pullScheme() {
            var parts = splitAllocation();
            var week = document.getElementById('weekNumber').value;
            var note = document.getElementById('schemeNote');

            if (!parts || !week) {
                note.textContent = 'Choose the class, subject and week first.';
                return;
            }
            note.textContent = 'Looking…';

            fetch('/lessons/suggest?subjectId=' + parts[1] + '&gradeLevel=' + parts[2]
                  + '&termNumber=' + termNumber + '&weekNumber=' + week)
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (!d || !d.topic) {
                        note.textContent = 'No scheme entry for that week yet.';
                        return;
                    }
                    setIfEmpty('topic', d.topic);
                    setIfEmpty('objectives', d.objectives);
                    setIfEmpty('teacherActivities', d.activities);
                    setIfEmpty('mediaAndResources', d.resources);
                    note.textContent = 'Filled from the scheme. Edit as you need.';
                });
        }

        function setIfEmpty(id, value) {
            var el = document.getElementById(id);
            if (el && !el.value && value) el.value = value;
        }
    </script>
</main>
</body>
</html>
