<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Sign in')}"></head>
<body>
<div class="gatefold">
    <div class="card">
        <p class="eyebrow">School Management</p>
        <h1>Sign in</h1>
        <p class="standfirst">Use the account issued by the school office.</p>

        <div class="notice bad" th:if="${param.error}">
            That username and password combination was not recognised.
        </div>
        <div class="notice good" th:if="${param.signedout}">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
