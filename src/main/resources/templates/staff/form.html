<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Staff details')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('staff')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Establishment</p>
    <h1 th:text="${member.id == null} ? 'Add a member of staff' : 'Edit staff details'">Add</h1>
    <p class="standfirst">Tick the subjects this teacher is qualified for — the allocation
       picker only offers those.</p>

    <form th:action="@{/staff}" th:object="${member}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="grid two">
            <div class="panel">
                <h3>Identity</h3>
                <div class="field"><label>Staff number</label>
                    <input type="text" th:field="*{staffNumber}" placeholder="Auto if blank"></div>
                <div class="field"><label>Title</label><input type="text" th:field="*{title}"
                    placeholder="Mr, Mrs, Ms, Dr"></div>
                <div class="field"><label>First name</label>
                    <input type="text" th:field="*{firstName}" required></div>
                <div class="field"><label>Surname</label>
                    <input type="text" th:field="*{surname}" required></div>
                <div class="field"><label>Sex</label>
                    <select th:field="*{gender}">
                        <option value="">—</option>
                        <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                    </select></div>
                <div class="field"><label>Mobile</label>
                    <input type="text" th:field="*{mobilePhone}" required></div>
                <div class="field"><label>Email</label><input type="email" th:field="*{email}"></div>
            </div>

            <div class="panel">
                <h3>Appointment</h3>
                <div class="field"><label>Category</label>
                    <select th:field="*{staffType}">
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select></div>
                <div class="field"><label>Employment status</label>
                    <select th:field="*{employmentStatus}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select></div>
                <div class="field"><label>Phase</label>
                    <select th:field="*{phase}">
                        <option value="">Both</option>
                        <option th:each="p : ${phases}" th:value="${p}" th:text="${p}"></option>
                    </select></div>
                <div class="field"><label>Job title</label><input type="text" th:field="*{jobTitle}"></div>
                <div class="field"><label>Teacher registration number</label>
                    <input type="text" th:field="*{teacherRegistrationNo}"></div>
                <div class="field"><label>Date joined</label>
                    <input type="date" th:field="*{dateJoined}"></div>
                <div class="field"><label>Qualifications</label>
                    <textarea th:field="*{qualifications}"></textarea></div>
            </div>
        </div>

        <h2>Subjects this teacher can take</h2>
        <div class="panel" style="columns:3 12rem">
            <label th:each="s : ${subjects}" style="text-transform:none;font-weight:400;
                   letter-spacing:0;font-size:.85rem">
                <input type="checkbox" name="subjectIds" th:value="${s.id}" style="width:auto"
                       th:checked="${member.teachableSubjects != null and
                                    #sets.contains(member.teachableSubjects, s)}">
                <span th:text="${s.name} + ' (' + ${s.phase} + ')'"></span>
            </label>
        </div>

        <p style="margin-top:1rem">
        <div class="field"><label>Department</label>
            <select th:field="*{department}">
                <option value="">None</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
            </select></div>
            <button class="btn" type="submit">Save</button>
            <a class="btn quiet" th:href="@{/staff}">Cancel</a>
        </p>
    </form>
</main>
</body>
</html>
