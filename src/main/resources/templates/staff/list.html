<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Staff')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('staff')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Establishment</p>
    <h1>Staff</h1>
    <p class="standfirst"><span th:text="${#lists.size(staffList)}">0</span> on strength.</p>

    <form class="inline" method="get" th:action="@{/staff}" style="margin-bottom:1rem">
        <div class="field" style="min-width:14rem"><label for="q">Name or staff number</label>
            <input type="text" id="q" name="q" th:value="${q}"></div>
        <div class="field"><label for="type">Category</label>
            <select id="type" name="type">
                <option value="">All</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t==type}"></option>
            </select></div>
        <button class="btn" type="submit">Search</button>
        <a class="btn quiet" th:href="@{/staff/new}">Add a member of staff</a>
    </form>

    <table class="register" th:if="${!#lists.isEmpty(staffList)}">
        <thead><tr><th>Staff no.</th><th>Name</th><th>Category</th><th>Department</th>
            <th>Phase</th><th>Phone</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${staffList}">
            <td class="code" th:text="${s.staffNumber}"></td>
            <td><a th:href="@{/staff/{id}(id=${s.id})}" th:text="${s.fullName}"></a></td>
            <td><span class="tag neutral" th:text="${s.staffType}"></span></td>
            <td th:text="${s.department != null} ? ${s.department.name} : '—'"></td>
            <td th:text="${s.phase} ?: 'Both'"></td>
            <td class="code" th:text="${s.mobilePhone}"></td>
            <td><a class="btn small quiet" th:href="@{/staff/{id}/edit(id=${s.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(staffList)}">No staff match that search.</div>
</main>
</body>
</html>
