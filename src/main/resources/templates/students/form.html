<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Learner details')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('students')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>

    <p class="eyebrow">Enrolment</p>
    <h1 th:text="${student.id == null} ? 'Enrol a learner' : 'Edit learner details'">Enrol</h1>
    <p class="standfirst">The admission number is generated automatically if you leave it blank.</p>

    <form th:action="${student.id == null} ? @{/students} : @{/students/{id}(id=${student.id})}"
          th:object="${student}" method="post">

        <div class="grid two">
            <div class="panel">
                <h3>Identity</h3>
                <div class="field"><label>Admission number</label>
                    <input type="text" th:field="*{studentNumber}" placeholder="Leave blank to generate"></div>
                <div class="field"><label>First name</label>
                    <input type="text" th:field="*{firstName}" required></div>
                <div class="field"><label>Middle name</label>
                    <input type="text" th:field="*{middleName}"></div>
                <div class="field"><label>Surname</label>
                    <input type="text" th:field="*{surname}" required></div>
                <div class="field"><label>Sex</label>
                    <select th:field="*{gender}" required>
                        <option value="">Choose</option>
                        <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                    </select></div>
                <div class="field"><label>Date of birth</label>
                    <input type="date" th:field="*{dateOfBirth}" required></div>
                <div class="field"><label>Birth entry / national ID</label>
                    <input type="text" th:field="*{nationalId}"></div>
            </div>

            <div class="panel">
                <h3>Placement</h3>
                <div class="field"><label>Class</label>
                    <select name="classId" required>
                        <option value="">Choose a class</option>
                        <option th:each="c : ${classes}" th:value="${c.id}"
                                th:text="${c.phase} + ' — ' + ${c.name}"
                                th:selected="${student.currentClass != null and student.currentClass.id == c.id}"></option>
                    </select></div>
                <div class="field"><label>Residency</label>
                    <select th:field="*{residency}">
                        <option th:each="r : ${residencies}" th:value="${r}" th:text="${r}"></option>
                    </select></div>
                <div class="field"><label>Admission date</label>
                    <input type="date" th:field="*{admissionDate}"></div>
                <div class="field"><label>Home address</label>
                    <textarea th:field="*{homeAddress}"></textarea></div>
                <div class="field"><label>Medical notes</label>
                    <textarea th:field="*{medicalNotes}"
                              placeholder="Allergies, chronic conditions, medication held by the sick bay"></textarea></div>
            </div>
        </div>

        <p style="margin-top:1rem">
            <button class="btn" type="submit">Save</button>
            <a class="btn quiet" th:href="@{/students}">Cancel</a>
        </p>
    </form>
</main>
</body>
</html>
