<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Syllabus coverage')}"></head>
<body>
<div th:replace="~{layout/base :: chrome('curriculum')}"></div>
<main class="sheet">
    <div th:replace="~{layout/base :: flash}"></div>
    <p class="eyebrow">Coverage</p>
    <h1 th:text="${subject.name} + ' · ' + ${schoolClass.name}">Coverage</h1>
    <p class="standfirst">Weeks of the scheme with no lesson plan against them, for term
       <span th:text="${termNumber}">1</span>.</p>

    <table class="register" th:if="${!#lists.isEmpty(gaps)}">
        <thead><tr><th class="num">Wk</th><th>Topic</th><th>Objectives</th></tr></thead>
        <tbody>
        <tr th:each="c : ${gaps}">
            <td class="num" th:text="${c.weekNumber}"></td>
            <td th:text="${c.topic}"></td>
            <td th:text="${c.objectives} ?: '—'"></td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(gaps)}">
        Every week of the scheme has a plan against it.</div>
</main>
</body>
</html>
